<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Admin Panel</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <link rel='stylesheet' type='text/css' href='css/admin_panel.css'>

    <script type="module" src='js/firebase_init.js' type="module"></script>
    <script type="module" src='js/admin_panel.js'></script>

</head>

<body>

    <form class="form" id="submit-project-form">
        <p class="title">Create a New Project! </p>

        <div class="flex">
        </div>

        <span>Project Title</span>
        <input class="input" type="text" id="project_title" placeholder="Enter Project Title" required="">

        <label>
            <span><br>Application Type: Web/Mobile/Desktop Application<br><br></span>
            <input type="radio" id="project_type1" name="project_type" value="Mobile Application">
            <label for="project_type1">Mobile Application</label><br>
            <input type="radio" id="project_type2" name="project_type" value="Web Application">
            <label for="project_type2">Web Application</label><br>
            <input type="radio" id="project_type3" name="project_type" value="Desktop Application">
            <label for="project_type3">Desktop Application</label><br>

            <label>
                <input type="radio" name="project_type" value="other">&nbsp;Other
                <input type="text" name="other" value="Write In" />
            </label>
        </label>

        <label>
            <span><br>Tech Stack<br><br></span>
            <input type="checkbox" id="tech_stack1" name="tech_stack" value="Python">
            <label for="tech_stack1">Python</label><br>
            <input type="checkbox" id="tech_stack2" name="tech_stack" value="Android">
            <label for="tech_stack2">Android</label><br>
            <input type="checkbox" id="tech_stack3" name="tech_stack" value="Java">
            <label for="tech_stack3">Java</label><br>
            <input type="checkbox" id="tech_stack4" name="tech_stack" value="HTML">
            <label for="tech_stack4">HTML5</label><br>
            <input type="checkbox" id="tech_stack5" name="tech_stack" value="CSS">
            <label for="tech_stack5">CSS3</label><br>
            <input type="checkbox" id="tech_stack6" name="tech_stack" value="JavaScript">
            <label for="tech_stack6">JavaScript</label><br>
            <input type="checkbox" id="tech_stack7" name="tech_stack" value="SQL">
            <label for="tech_stack7">SQL</label><br>
        </label>

        <br>

        <label for="opensource">Open Source Project
            <input type="checkbox" id="opensource" name="opensource" value="opensource">
        </label>

        <label>
            <span><br>Demo Type?<br><br></span>
            <input type="radio" id="demo_type1" name="demo_type" value="demo_pc">
            <label for="demo_type1">PC (Laptop/Computer)</label><br>
            <input type="radio" id="demo_type2" name="demo_type" value="demo_laptop">
            <label for="demo_type2">Mobile</label><br>
        </label>
        <br>

        <span>Project Description</span>
        <input class="input" id="project_description" type="text" placeholder="Enter Description" required="">
        <br>

        <span>Github Link</span>
        <input class="input" id="githubLink" type="text" placeholder="Enter Github Link" required="">
        <br>

        <label for="img">Project Demo:</label>
        <input type="file" id="file-selector-demo" accept=".jpg, .jpeg, .png, .mp4">
        <br>

        <label for="img">Select image:</label>
        <input type="file" id="file-selector-image" accept=".jpg, .jpeg, .png">
        <br>

        <button class="submit">Create New Project</button>
    </form>
</body>

</html>
