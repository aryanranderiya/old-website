<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found</title>
  <link rel='stylesheet' type='text/css' href='css/404.css'>
  <link rel='stylesheet' type='text/css' href='css/buttons.css'>
  <link rel='stylesheet' type='text/css' href='css/cursor.css'>
  <link rel='stylesheet' type='text/css' href='css/animated_gradient_cursormovement.css'>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0" />

</head>

<body>

  <!--! Custom Cursor -->
  <div class="cursor">
    <span class="material-symbols-rounded" id="cursoricon3">open_in_new</span>
    <img src="media/icons/ios_icon_warning.png" id="cursoriconwarning">
    <img src="media/icons/ios_icon_point_top.png" id="cursoricon5">
  </div>

  <!--! Main Content -->
  <div id="message" class="content">
    <h1 class="fourzerofour">404</h1>
    <div>
      <img loading="eager" src="media/error_image.png" alt="404 Image" class="error_image">
    </div>
    <h8 class="description">The page you requested could not be found on <a href="https://aryanranderiya.com"
        style="color:#00bbff">aryanranderiya.com</a>. <br><br>
      This means you either entered a wrong URL or the page is still under development.</h8>

    <button class="button_blue" id="btn1" onclick="history.back()">Go Back&nbsp;
      <div class=" icon">
        <span style="color:black;" class="material-symbols-rounded">arrow_back</span>
      </div>
    </button>
  </div>

  <!--! Background -->
  <canvas class="animated_cursormovement_canvas"></canvas>

  <!--! Scripts -->
  <script src="js/404.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/animated_gradient_cursormovement.js"></script>

</body>

</html>
