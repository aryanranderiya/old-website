<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found</title>
    <link rel="stylesheet" type="text/css" href="css/404.css?v=20261124b" />
    <link rel="stylesheet" type="text/css" href="css/buttons.css?v=20261124b" />
    <link rel="stylesheet" type="text/css" href="css/cursor.css?v=20261124b" />

    <link rel="stylesheet" type="text/css" href="css/materialSymbolsRounded.css?v=20261124b" />
    
    

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./media/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./media/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./media/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="./media/favicons/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#00bbff" />
    <meta name="theme-color" content="#ffffff" />
  
    <link rel="stylesheet" type="text/css" href="packages/fontawesome/css/all.min.css" />
  </head>

  <body>
    <!--! Custom Cursor -->
    <div class="cursor">
      <span class="material-symbols-rounded" id="cursoricon3">&#xe895;</span>
      <img
        src="media/icons/ios_icon_warning.webp"
        id="cursoriconwarning"
        alt="Cursor warning icon"
      />
      <img
        src="media/icons/ios_icon_point_top.webp"
        id="cursoricon5"
        alt="Cursor pointer icon"
      />
    </div>

    <!--! Main Content -->
    <div id="message" class="content">
      <h1 class="fourzerofour">404</h1>
      <div>
        <img
          loading="eager"
          src="media/error_image.webp"
          alt="Page not found - 404 error illustration"
          class="error_image"
        />
      </div>
      <h8 class="description"
        >The page you requested could not be found on
        <a
          href="/"
          style="color: #00bbff"
          class="hyperlink"
          >aryanranderiya.com</a
        >. <br /><br />
        This means you either entered a wrong URL or the page is still under
        development.</h8
      >

      <button
        class="button_blue"
        id="btn1"
        onclick="history.back()"
        aria-label="Go Back"
      >
        Go Back&nbsp;
        <div class="icon">
          <span style="color: #00bbff" class="material-symbols-rounded"
            >&#xe5c4;</span
          >
        </div>
      </button>
    </div>

    <!--! Background -->
    <canvas class="animated_cursormovement_canvas"></canvas>

    <!--! Scripts -->
    <script type="module" src="js/404.js?v=20261124b"></script>
    <script type="module" src="js/cursor.js?v=20261124b"></script>
    <script type="module" src="js/animated_gradient_cursormovement.js?v=20261124b"></script>
  </body>
</html>
