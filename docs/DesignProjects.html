<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Projects</title>
    <link rel='stylesheet' type='text/css' href='css/design_projects.css'>
    <link rel='stylesheet' type='text/css' href='css/cursor.css'>
    <link rel='stylesheet' type='text/css' href='css/preloader.css'>
    <link rel='stylesheet' type='text/css' href='css/navbar.css'>

    <script defer src="https://kit.fontawesome.com/2fafe620ef.js" crossorigin="anonymous"></script>
</head>

<body>

    <!--! Preloader -->
    <div class="black_cover visible center-content">
        <div class="preloader">
            <div class="spinner">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <text id="loading_text">Loading...</text>
            <div class="custom-loader"></div>
        </div>
    </div>

    <!--! Custom Cursor -->
    <div class="cursor">
        <h1 id="cursortext">Languages</h1>
        <span class="material-symbols-rounded " id="cursoricon1">
            arrow_forward
        </span>
        <span class="material-symbols-rounded " id="cursoricon2">
            arrow_downward
        </span>
        <span class="material-symbols-rounded" id="cursoricon3">
            open_in_new
        </span>
        <i class="fa-regular fa-comments" id="cursoricon4"></i>
        <img src="media/icons/ios_icon_point_top.webp" id="cursoricon5">

        <img src="media/icons/ios_icon_handwave.webp" id="cursoriconwave">
        <img src="media/icons/ios_icon_idea.webp" id="cursoriconidea">
        <img src="media/icons/ios_icon_laptop.webp" id="cursoriconlaptop">
        <img src="media/icons/ios_icon_pallette.webp" id="cursoriconpallette">
        <img src="media/icons/icon_drag.webp" id="cursoricondrag">

    </div>

    <div class="cursor_glow_div">
        <span class="cursor_glow"></span>
    </div>

    <!--! Navigation Bar -->
    <header id="navbarContainer"></header>

    <!-- ! Section 0 -->
    <section class="content0">
        <div class="title">
            <h1 class="font-weight-bold title-heading"><br>DESIGN PROJECTS</h1>
            <!-- <h5 class="font-weight-bold subheading"><br>by Aryan Randeriya</h1> -->
        </div>

        <div class="folders">
            <div class="folder" id="folder_one">
                <img src="media/collection/collection_one.png" loading="eager" class="folder_image" />
            </div>

            <div class="folder" id="folder_two">
                <img src="media/collection/collection_two.png" loading="eager" class="folder_image" />
            </div>

            <div class="folder" id="folder_three">
                <img src="media/collection/collection_three.png" loading="eager" class="folder_image" />
            </div>

            <div class="folder" id="folder_four">
                <img src="media/collection/collection_four.png" loading="eager" class="folder_image" />
            </div>
        </div>

    </section>

    <!-- ! Section Content 1 -->
    <section class="content1">
        <div class="heading_title" id="title_apparel">
            <h1 class="heading_title_text heading_title_text_apparel">Apparel</h1>
            <i class="fa-solid fa-arrow-turn-down title_icon "></i>
            <!-- <hr> -->
        </div>

        <!-- ! Merchandise Designs -->

        <div class="merchdesigns">
            <div class="merch_items" id="merchItemsContainer">
            </div>
        </div>

    </section>

    <!-- ! Section Content 2 -->
    <section class="section2">

        <div class="heading_title">
            <i class="fa-solid fa-arrow-turn-down title_icon"></i>
            <h1 class="heading_title_text" id="headers_title">Headers</h1>
            <!-- <hr> -->
        </div>
        <div class="slider">
            <div class="slider-wrapper">
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__w0lfzzybanner0.webp" class="header_image">
                    </figure>
                </div>

                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__w0lfzzybanner1.webp" class="header_image">
                    </figure>
                </div>

                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__teamflight.webp" class="header_image">
                    </figure>
                </div>

                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__f4lloutesports.webp" class="header_image">
                    </figure>
                </div>

                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__w0lfzzybanner2.webp" class="header_image">
                    </figure>
                </div>

                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__tootles.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__txro.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__zezzy1.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__w0lfzzybanner3.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__w0lfzzybanner4.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__anya.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__w0lfzzybanner5.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__azrec.webp" class="header_image">
                    </figure>
                </div>
                <div class="slider-item">
                    <figure>
                        <img loading="eager" src="media/headers/headers__lumiin.webp" class="header_image">
                    </figure>
                </div>
            </div>
            <div class="slider-progress">
                <div class="slider-progress-bar"></div>
            </div>
        </div>
    </section>


    <!--! Footer -->
    <footer id="footerContainer"></footer>
    <script src="js/preloader.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/footer.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/design_projects.js"></script>
</body>

</html>
