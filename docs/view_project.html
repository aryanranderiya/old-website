<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Project</title>
    <link rel='stylesheet' type='text/css' href='css/view_project.css'> <!-- ! CHANGE CUSTOM CSS-->

    <link rel='stylesheet' type='text/css' href='css/cursor.css'>
    <link rel='stylesheet' type='text/css' href='css/preloader.css'>
    <link rel='stylesheet' type='text/css' href='css/navbar.css'>
    <script src="https://kit.fontawesome.com/2fafe620ef.js" crossorigin="anonymous"></script>

</head>

<body>
    <!-- Preloader -->
    <div class="black_cover visible center-content">
        <div class="preloader">
            <div class="spinner">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <text id="loading_text">Loading...</text>
            <div class="custom-loader"></div>
        </div>
    </div>

    <!--! Navigation Bar -->
    <header id="navbarContainer"></header>

    <!--! Custom Cursor -->

    <div class="cursor">
        <span class="material-symbols-rounded " id="cursoricon1">
            arrow_forward
        </span>
        <span class="material-symbols-rounded " id="cursoricon2">
            arrow_downward
        </span>
        <span class="material-symbols-rounded" id="cursoricon3">
            open_in_new
        </span>
        <i class="fa-regular fa-comments" id="cursoricon4"></i>
        <img src="images/ios_icon_point_top.png" id="cursoricon5">
    </div>


    <!--! Section 1 -->
    <section class="section1">


        <div class="subcontent1">
            <div class="subcontent1_titledesc">
                <h1 class="project_title"> Project Title</h1>

                <div class="project_type">
                    <div class="p_type">
                        <i class="p_type_icon fa-solid fa-laptop-code"></i>
                        <text>Desktop Application</text>
                    </div>
                </div>

                <h7 class="project_desc">
                    A short Description
                </h7>

                <div class="tech_stack">
                    <div class="tech_stack_item">
                        <i class="tech_stack_icon fa-brands fa-android"></i>
                        <text>Android</text>
                    </div>
                    <div class="tech_stack_item">
                        <i class="tech_stack_icon fa-brands fa-java"></i>
                        <text>Java</text>
                    </div>
                </div>
            </div>
        </div>

        <div class="cursor_glow_container">
            <div class="cursor_glow_div_three">
                <span class="cursor_glow_three"></span>
            </div>
        </div>

        <div class="subcontent2">
            <div class="mockup">
                <div class="mockup-container">
                    <img src="images/macbook.png" class="mockup_laptop">
                    <video controls class="mockup_video_laptop" autoplay
                        controlsList="nodownload noplaybackrate noremoteplayback" disablePictureInPicture loop>
                        <source src="videos/demo.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <h7 style="color:white"> Project Demo</h7>

                </div>
            </div>
        </div>
    </section>

    <!--! Footer -->
    <header id="footerContainer"></header>


    <!-- Scripts -->

    <script src="js/view_project.js" type="module"></script>

    <script defer src="js/navbar.js"></script>
    <script defer src="js/footer.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/preloader.js"></script>
</body>

</html>
