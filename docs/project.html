<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel='stylesheet' type='text/css' href='css/project.css'>
    <link rel='stylesheet' type='text/css' href='css/cursor.css'>
    <link rel='stylesheet' type='text/css' href='css/preloader.css'>
    <link rel='stylesheet' type='text/css' href='css/navbar.css'>
    <link rel='stylesheet' type='text/css' href='css/buttons.css'>
    <script src="https://kit.fontawesome.com/2fafe620ef.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</head>

<body>


    <!-- Preloader -->
    <div class="black_cover visible center-content">

        <div class="preloader">
            <div class="spinner">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <text id="loading_text">Loading...</text>
            <div class="custom-loader"></div>
        </div>
        <div class="custom-shape-divider-top-1707225707">
            <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"
                preserveAspectRatio="none">
                <path d="M600,112.77C268.63,112.77,0,65.52,0,7.23V120H1200V7.23C1200,65.52,931.37,112.77,600,112.77Z"
                    class="shape-fill"></path>
            </svg>
        </div>
    </div>


    <!--! Navigation Bar -->
    <header id="navbarContainer"></header>


    <!--! Custom Cursor -->
    <div class="cursor">
        <h1 id="cursortext">Languages</h1>
        <span class="material-symbols-rounded " id="cursoricon1">
            arrow_forward
        </span>
        <span class="material-symbols-rounded " id="cursoricon2">
            arrow_downward
        </span>
        <span class="material-symbols-rounded" id="cursoricon3">
            open_in_new
        </span>
        <i class="fa-regular fa-comments" id="cursoricon4"></i>
        <img src="media/icons/ios_icon_point_top.webp" id="cursoricon5">
        <img src="media/icons/ios_icon_handwave.webp" id="cursoriconwave">
        <img src="media/icons/ios_icon_idea.webp" id="cursoriconidea">
        <img src="media/icons/ios_icon_laptop.webp" id="cursoriconlaptop">
        <img src="media/icons/ios_icon_pallette.webp" id="cursoriconpallette">

    </div>
    <div class="cursor_glow_div"><span class="cursor_glow"></span></div>


    <!--! Section 1 -->
    <section class="section1">
        <div class="subcontent1">
            <div class="subcontent1_titledesc">
                <h1 class="project_title"> Project Title</h1>

                <div class="project_type">
                    <div class="p_type">
                        <span class="material-symbols-outlined p_type_icon">
                            laptop_mac
                        </span>
                        <text class="p_type_text">Desktop Application</text>
                    </div>
                </div>

                <h7 class="project_desc">
                    A short Description
                </h7>

                <div class="tech_stack"> </div>
            </div>
        </div>

        <div class="cursor_glow_container">
            <div class="cursor_glow_div_three">
                <span class="cursor_glow_three"></span>
            </div>
        </div>
    </section>


    <section class="section2">

        <div class="subcontent2">
            <div class="mockup mockup_phone">
                <div class="mockup_container">
                    <img loading="eager" src="media/mockup_iPhone.png" class="mockup_mobile image">
                    <div class="container-mobile">
                        <video class="mockup_media_mobile video" muted="muted">
                            <source src="" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                </div>
            </div>

            <div class="mockup mockup_pc">
                <div class="mockup_container">
                    <img src="media/mockup_Macbook.png" class="mockup_laptop image">
                    <div class="container-laptop">
                        <img loading="eager" src="" class="mockup_media_laptop image">
                        <video loading="eager" class="mockup_media_laptop video" muted="muted">
                            <source src="" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                </div>
            </div>

            <div class="video_controls_container">
                <div class="video_controls_others">
                    <div class="icons">
                        <i id="control_rewind" class="fa-solid fa-rotate-left control_icon"></i>
                        <i id="control_backward" class="fa-solid fa-backward-fast control_icon"></i>
                        <i id="control_forward" class="fa-solid fa-forward-fast control_icon"></i>
                    </div>
                </div>
                <div class="video_controls_playback">
                    <div class="dot"></div>
                    <div class="icons main">
                        <i id="control_playback" class="fa-solid fa-play control_icon icon_main"></i>
                        <i id="icons_main_pause" class="fa-solid fa-pause control_icon icon_main"></i>
                        <i id="icons_main_replay" class="fa-solid fa-arrows-rotate control_icon icon_main"></i>
                    </div>
                </div>
            </div>
        </div>


        <div id="progress-bar"></div>
        <div class="bar_container">
        </div>

        <button class="scrolltotop">
            <span class="material-symbols-outlined" id="scrolltop_icon">vertical_align_top</span>
        </button>


        <div class="subcontent3">
            <div class="buttons">
                <a href="" class="btn_github_anchor">
                    <button class="button_primary" aria-label="Github Repository">
                        Github Repository
                        <div class="icon">
                            <i class="fa-brands fa-github btn_icon_1"></i>
                        </div>
                    </button>
                </a>

                <a href="" class="btn_try_anchor" target="_blank">
                    <button class="button_secondary">
                        Try it Out
                        <div class="icon">
                            <i class="fa-solid fa-square-arrow-up-right btn_icon_2"></i>
                        </div>
                    </button>
                </a>
            </div>
            <div class="project_info_text"></div>
        </div>


    </section>


    <!--! Footer -->
    <footer id="footerContainer"></footer>

    <!--! Scripts -->
    <script src="js/project.js" type="module"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/footer.js"></script>
    <script src="js/cursor.js"></script>

    <!--! GSAP -->
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    
</body>

</html>
