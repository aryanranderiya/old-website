<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Software Projects</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <link rel='stylesheet' type='text/css' href='css/cursor.css'>
    <link rel='stylesheet' type='text/css' href='css/software_projects.css'>
    <link rel='stylesheet' type='text/css' href='css/terminal_card.css'>
    <link rel='stylesheet' type='text/css' href='css/preloader.css'>
    <link rel='stylesheet' type='text/css' href='css/cursor.css'>
    <link rel='stylesheet' type='text/css' href='css/navbar.css'>
    <link rel='stylesheet' type='text/css' href='css/buttons.css'>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


    <!--! GSAP -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
</head>

<body>
    <!--! Preloader -->
    <div class="black_cover visible center-content">
        <div class="preloader">
            <div class="spinner">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <text id="loading_text">Loading...</text>
            <div class="custom-loader"></div>
        </div>
    </div>

    <!--! Navigation Bar -->
    <header id="navbarContainer"></header>

    <!--! Custom Cursor -->
    <div class="cursor">
        <h1 id="cursortext">My Skills</h1>
        <span class="material-symbols-rounded " id="cursoricon1">
            arrow_forward
        </span>
        <span class="material-symbols-rounded " id="cursoricon2">
            arrow_downward
        </span>
        <span class="material-symbols-rounded" id="cursoricon3">
            open_in_new
        </span>
        <i class="fa-regular fa-comments" id="cursoricon4"></i>
        <img src="media/icons/ios_icon_point_top.png" id="cursoricon5">
    </div>

    <div class="cursor_glow_div">
        <span class="cursor_glow"></span>
    </div>


    <section>

        <div class="title">
            <h1 class="title-heading" id="software_projects_title"><br>Software<br>Projects</h1>
        </div>

        <!-- The Terminal -->
        <div class="terminal_container">
            <div class="terminal_toolbar">
                <div class="butt">
                    <button class="btn btn-color" aria-label="terminal button 1"></button>
                    <button class="btn" aria-label="terminal button 2"></button>
                    <button class="btn" aria-label="termninal button 3"></button>
                </div>
                <p class="user">aryanranderiya: ~</p>
                <div class="add_tab">
                    +
                </div>
            </div>

            <div class="terminal_body">
                <div class="terminal_promt">
                    <span class="terminal_user">aryan@randeriya:</span>
                    <span class="terminal_location">~</span>
                    <span class="terminal_bling ">Welcome! Here you can view all my Software
                        Development Projects i've
                        ever
                        made!<br>
                        Alternate Portfolio:

                        <a id="terminal_link" href="https://github.com/aryanranderiya">Github/AryanRanderiya </a>
                    </span>
                    <span class="terminal_cursor"> </span>
                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="logos">
            <div class="logos-slide">
                <img src="media/logos/logo_python.png" class="logos_tools">
                <img src="media/logos/logo_java.png" class="logos_tools">
                <img src="media/logos/logo_android.png" class="logos_tools">
                <img src="media/logos/logo_firebase.png" class="logos_tools">
                <img src="media/logos/logo_html.png" class="logos_tools">
                <img src="media/logos/logo_css.png" class="logos_tools">
                <img src="media/logos/logo_git.png" class="logos_tools">
                <img src="media/logos/logo_JavaScript.png" class="logos_tools">
                <img src="media/logos/logo_mysql.png" class="logos_tools">
            </div>
            <div class="logos-slide">
                <img src="media/logos/logo_python.png" class="logos_tools">
                <img src="media/logos/logo_java.png" class="logos_tools">
                <img src="media/logos/logo_android.png" class="logos_tools">
                <img src="media/logos/logo_firebase.png" class="logos_tools">
                <img src="media/logos/logo_html.png" class="logos_tools">
                <img src="media/logos/logo_css.png" class="logos_tools">
                <img src="media/logos/logo_git.png" class="logos_tools">
                <img src="media/logos/logo_JavaScript.png" class="logos_tools">
                <img src="media/logos/logo_mysql.png" class="logos_tools">
            </div>
        </div>

        <div class="cards cardhidden"></div>
    </section>

    <!--! Footer -->
    <footer id="footerContainer"></footer>

    <!-- Scripts -->

    <script>
        function redirectToProjectPage(projectId) {
            sessionStorage.setItem("projectId", projectId);
            window.location.href = "view_project.html";
        }
    </script>
    <script src="js/cursor.js"></script>
    <script src="js/cards.js"></script>
    <link rel='stylesheet' type='text/css' href='css/card.css'>
    <script src="js/software_projects.js" type="module"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/footer.js"></script>

</body>

</html>
