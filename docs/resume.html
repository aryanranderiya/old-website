<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resume</title>

    <link rel='stylesheet' type='text/css' href='css/cursor.css'>
    <link rel='stylesheet' type='text/css' href='css/resume.css'>
    <link rel='stylesheet' type='text/css' href='css/preloader.css'>
    <link rel='stylesheet' type='text/css' href='css/navbar.css'>
    <link rel='stylesheet' type='text/css' href='css/buttons.css'>
    <script src="https://kit.fontawesome.com/2fafe620ef.js" crossorigin="anonymous"></script>

</head>

<body>
    <!-- Preloader -->
    <div class="black_cover visible center-content">
        <div class="preloader">
            <div class="spinner">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <text id="loading_text">Loading...</text>
            <div class="custom-loader"></div>
        </div>
    </div>

    <!--! Navigation Bar -->
    <header id="navbarContainer"></header>

    <!--! Custom Cursor -->

    <div class="cursor">
        <h1 id="cursortext">Languages</h1>
        <span class="material-symbols-rounded " id="cursoricon1">
            arrow_forward
        </span>
        <span class="material-symbols-rounded " id="cursoricon2">
            arrow_downward
        </span>
        <span class="material-symbols-rounded" id="cursoricon3">
            open_in_new
        </span>
        <i class="fa-regular fa-comments" id="cursoricon4"></i>
        <img src="images/ios_icon_point_top.png" id="cursoricon5">

        <img src="images/ios_icon_handwave.png" id="cursoriconwave">
        <img src="images/ios_icon_idea.png" id="cursoriconidea">
        <img src="images/ios_icon_laptop.png" id="cursoriconlaptop">
        <img src="images/ios_icon_pallette.png" id="cursoriconpallette">

    </div>


    <!--! Section 1 -->
    <section class="section1">
        <div class="titlediv">
            <h1 class="title">My Resume</h1>
            <h6 class="subtitle">Last Updated 1st Feb 2024</h6>
        </div>
        <div class="subcontent1">
            <img src="images/Resume.png" class="resume_image">
        </div>

        <div class="cursor_glow_container">
            <div class="cursor_glow_div_three">
                <span class="cursor_glow_three"></span>
            </div>
        </div>

    </section>


    <div class="btn_download">
        <a href="images/Resume.pdf" download="Aryan Randeriya's Resume.pdf">
            <button class="button">
                <text class="downloadresume_text">Download Resume</text>
                <span class="material-symbols-outlined svgIcon">
                    download
                </span>
            </button>
        </a>
    </div>

    <!--! Footer -->
    <footer id="footerContainer"></footer>

    <div id="progress-bar"></div>
    <div class="bar_container">
    </div>


    <!--! Scripts -->
    <script src="js/resume.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/footer.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/preloader.js"></script>
</body>

</html>
